# Vite 8 / Rolldown native bindings require Node ^20.19.0 || >=22.12.0.
# Nixpacks was resolving 22.11.0, which skips @rolldown/binding-linux-x64-gnu.
[variables]
NIXPACKS_NODE_VERSION = "22.12.0"

[phases.setup]
aptPkgs = [
  "...",
  # Required by `@puppeteer/browsers` to extract the Chrome zip during
  # `npx puppeteer browsers install chrome` (build fails without it).
  "unzip",
  "ca-certificates",
  "fonts-liberation",
  "libatk-bridge2.0-0",
  "libatk1.0-0",
  "libcairo2",
  "libcups2",
  "libdbus-1-3",
  "libdrm2",
  "libexpat1",
  "libgbm1",
  "libglib2.0-0",
  "libgtk-3-0",
  "libnspr4",
  "libnss3",
  "libpango-1.0-0",
  "libx11-6",
  "libx11-xcb1",
  "libxcb1",
  "libxcomposite1",
  "libxcursor1",
  "libxdamage1",
  "libxext6",
  "libxfixes3",
  "libxi6",
  "libxrandr2",
  "libxrender1",
  "libxss1",
  "libxtst6",
  "xdg-utils"
]
